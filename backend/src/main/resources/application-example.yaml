# ============================================================================
# application-example.yaml —— 环境配置模板（随仓库提交，不含任何真实凭据）
# ----------------------------------------------------------------------------
# 使用方法：
#   1. 本地开发：  复制为 application-dev.yaml，填写真实数据库 / Redis / 邮箱等值
#   2. 生产部署：  复制为 application-prod.yaml，填写服务器真实值
#   示例密码一律为占位符（123456 / change-me-*），请务必替换。
#   这两个副本已被 .gitignore 忽略，不会上传到远程仓库。
# ============================================================================

spring:
  mail:
    # 发件邮箱与 SMTP 授权码（QQ 邮箱需开启 SMTP 并填写授权码，而非登录密码）
    username: your-mail@example.com
    password: your-smtp-authorization-code
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/56_app
    username: postgres
    password: "123456"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      leak-detection-threshold: 0
  data:
    redis:
      host: localhost
      port: 6379
      # 如 Redis 设置过密码请填写，无密码可删除该行
      # password: "123456"
easy-query:
  print-sql: true
app:
  crypto:
    # 用户密码等敏感字段的 AES 加密密钥（16 位）
    # ⚠️ 生产必须改为随机强密钥；已上线数据请保持与历史一致，否则无法解密
    aes-key: "changeMe12345678"
    aes-iv: "changeMe87654321"
  admin:
    # 首次启动自动创建的超管账号（RbacDataInitializer）
    account: admin@example.com
    password: "Admin12345@"
  cors:
    # 允许跨域的前端地址（C 端 / 管理端 dev server）
    allowed-origins: http://localhost:5173,http://localhost:5273
  notify:
    # 社区通知邮件通道：按产品决策开启，但仅「审核结果」会自动发信；
    # 网站公告由后台 OA 群发接口按次指定是否发邮件。
    # 注意：这里的 SMTP 为真实账号，测试请用可真实收信的邮箱或临时置为 false。
    email-enabled: true
    # 公告群发单次收件人上限 / 「活跃用户」受众的判定窗口（天）
    broadcast-max-recipients: 2000
    active-window-days: 30
  translate:
    # 机器翻译（默认「词表优先 + AI 兜底」，都不依赖商业翻译 API）：
    #   glossary 本地文化词表（存库、后台可维护）| spring-ai（AiConfig 的 ChatClient，走 spring.ai.openai.*）
    #   | libretranslate | ollama | none（关闭，前端隐藏「译」按钮）
    provider: glossary
    # 主提供方失败（超时 / 额度 / 断网 / 词表覆盖率不足）时的兜底提供方；none 表示仅显示原文
    fallback-provider: spring-ai
    # 词表可接受的最低覆盖率（低于则让给兜底提供方，避免展示半截混杂文本）
    glossary-min-coverage: 0.8
    # AI 翻译时把译文里的文化术语实时沉淀进词表（只新增、不覆盖）
    auto-glossary-enabled: true
    auto-glossary-max-terms: 8
    # 自托管服务地址，如 http://127.0.0.1:5000（LibreTranslate）/ http://127.0.0.1:11434（Ollama）
    base-url: ""
    # 可选（LibreTranslate 支持）；Ollama 使用的本地模型名（spring-ai 的模型见 spring.ai.openai.chat.model）
    api-key: ""
    model: qwen2.5:7b
    timeout-seconds: 8
    max-chars: 4000
    cache-enabled: true
