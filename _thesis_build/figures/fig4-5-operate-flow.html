  <rect x="140" y="34" width="320" height="40" rx="20" fill="#e9f7ef" stroke="#31445c" stroke-width="1.6"/><text class="t" x="300" y="59" text-anchor="middle">开始</text><rect x="140" y="110" width="320" height="46" rx="8" fill="#eaf1fb" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="138" text-anchor="middle">用户访问系统，加载首页与全局导航</text><polygon points="300,192 480,234 300,276 120,234" fill="#fff6e5" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="239" text-anchor="middle">用户是否已登录？</text><rect x="140" y="312" width="320" height="46" rx="8" fill="#eaf1fb" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="340" text-anchor="middle">进入内容频道，提交筛选或检索条件</text><rect x="140" y="394" width="320" height="46" rx="8" fill="#eaf1fb" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="422" text-anchor="middle">后端按条件查询数据并返回结果集</text><rect x="140" y="476" width="320" height="46" rx="8" fill="#eaf1fb" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="504" text-anchor="middle">前端渲染列表，用户进入详情页阅读</text><polygon points="300,558 480,600 300,642 120,600" fill="#fff6e5" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="597" text-anchor="middle">是否需要互动？</text><text class="ts" x="300" y="613" text-anchor="middle">（收藏 / 点赞 / 评论 / 分享）</text><rect x="140" y="678" width="320" height="46" rx="8" fill="#eaf1fb" stroke="#31445c" stroke-width="1.6"/><text class="ts" x="300" y="706" text-anchor="middle">校验登录状态，写入互动记录并更新计数</text><rect x="140" y="760" width="320" height="40" rx="20" fill="#f7dfd8" stroke="#31445c" stroke-width="1.6"/><text class="t" x="300" y="785" text-anchor="middle">结束</text><line x1="300" y1="74" x2="300" y2="110" stroke="#31445c" stroke-width="1.4" marker-end="url(#ah)"/><line x1="300" y1="156" x2="300" y2="192" stroke="#31445c" stroke-width="1.4" marker-end="url(#ah)"/><line x1="300" y1="276" x2="300" y2="312" stroke="#31445c" stroke-width="1.4" marker-end="url(#ah)"/><text class="lbl" x="313" y="2
